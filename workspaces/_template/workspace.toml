[workspace]
description = ""

[topology]
file = "context/topology.md"

# Add one or more sources. Paths are relative to this workspace folder.
#
# [sources.local]
# type = "sqlite"
# path = "data/my.sqlite"
#
# [sources.prod]
# type = "databricks"
# profile = "customer"             # databricks CLI profile (databricks auth login --profile customer)
# warehouse_id = "<sql-warehouse-id>"
# catalog = "<catalog>"
# schema = "<default-schema>"      # optional when every table below is schema-qualified
# tables = ["orders", "customers", "crm.accounts", "ref_*"]   # optional scope; omit for the whole schema
# query_timeout_seconds = 120
#
# SQLite sources can also limit scope with tables = [...]

[sampling]
# Raw values may only be returned (and sent to Foundry) for allowlisted table.column globs,
# for example ["ref_*.*", "*.category"]. Everything else exposes counts and value shapes only.
allowlist = []

# Optional overrides of ddg.toml defaults:
# [run]
# max_minutes = 10
# max_cost_usd = 2.0
#
# [agent]
# planner = "auto"   # auto | foundry | heuristic
